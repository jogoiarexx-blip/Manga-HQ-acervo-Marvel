<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga HQ Acervo Marvel</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0d1016;color:#f5f7fb;margin:0;padding:24px}
.wrap{max-width:1200px;margin:auto}
.hero{padding:26px 0 12px}.hero h1{margin:0;font-size:clamp(28px,5vw,48px)}.hero p{color:#aeb8ca}
.status{margin:10px 0 26px}.ok{color:#7ee787}.err{color:#ff7b72}
.collection{margin:30px 0}.collection h2{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}
.card{background:#171c26;border:1px solid #262e3d;border-radius:14px;overflow:hidden}
.cover{aspect-ratio:2/3;background:#202838;display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}.fallback{padding:18px;text-align:center;font-weight:800}
.body{padding:10px}.body b{display:block;line-height:1.25}.body small{display:block;color:#9ca8bb;margin-top:5px}
@media(max-width:520px){body{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body b{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><h1>Manga HQ Acervo Marvel</h1><p>Catálogo Marvel integrado ao Manga-HQ-hub.</p></header>
  <p id="status" class="status">Carregando catálogo…</p>
  <main id="collections"></main>
</div>
<script>
(async()=>{
 const status=document.getElementById('status'),host=document.getElementById('collections');
 try{
  const c=await fetch('./catalogo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});
  status.innerHTML='<span class="ok">✓ catálogo OK</span> — '+c.itemCount+' edições';
  for(const col of c.collections||[]){
   const section=document.createElement('section');section.className='collection';
   const h=document.createElement('h2');h.textContent=col.title+' — '+(col.issues||[]).length+' edições';section.append(h);
   const grid=document.createElement('div');grid.className='grid';
   for(const x of col.issues||[]){
    const card=document.createElement('article');card.className='card';
    const cover=document.createElement('div');cover.className='cover';
    const img=document.createElement('img');img.loading='lazy';img.alt='Capa de '+x.title;img.src=x.cover||'';
    const fb=document.createElement('div');fb.className='fallback';fb.textContent=x.title;
    img.onload=()=>fb.remove();img.onerror=()=>img.remove();cover.append(img,fb);
    const body=document.createElement('div');body.className='body';
    const title=document.createElement('b');title.textContent=x.title;
    const meta=document.createElement('small');meta.textContent=x.pageCount?x.pageCount+' páginas':'PDF';
    body.append(title,meta);card.append(cover,body);grid.append(card);
   }
   section.append(grid);host.append(section);
  }
 }catch(e){status.innerHTML='<span class="err">Erro: '+e.message+'</span>'}
})();
</script>
</body>
</html>
