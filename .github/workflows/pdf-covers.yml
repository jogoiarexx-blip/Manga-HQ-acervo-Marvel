name: Atualizar catálogo e capas Marvel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '.github/workflows/pdf-covers.yml'

permissions:
  contents: write

concurrency:
  group: marvel-pdf-covers
  cancel-in-progress: true

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pymupdf pillow

      - name: Gerar catálogo, capas e páginas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json, re, fitz
          from PIL import Image

          root=Path('.')
          raw='https://raw.githubusercontent.com/jogoiarexx-blip/Manga-HQ-acervo-Marvel/main/'

          defs=[
            ('Hulk 2014','hulk-2014','Hulk (2014)'),
            ('Hulk Cinza','hulk-cinza','Hulk Cinza'),
            ('Hulk O Ultimo Tita','hulk-o-ultimo-tita','Hulk: O Último Titã'),
            ('O Ultimo Wolverine','o-ultimo-wolverine','O Último Wolverine'),
            ('Wolverine Supremo','wolverine-supremo','Wolverine Supremo'),
            ('Planeta Hulk','planeta-hulk','Planeta Hulk'),
            ('Queda dos Hulks','queda-dos-hulks','Queda dos Hulks'),
            ('Thanos vs Hulk','thanos-vs-hulk','Thanos vs. Hulk'),
          ]

          def issue_of(name):
              m=re.search(r'#\s*(\d+)',name,re.I)
              if m:return int(m.group(1))
              nums=[int(x) for x in re.findall(r'(\d+)',name)]
              return nums[-1] if nums else 1

          def url_path(path):
              return '/'.join(quote(p,safe='') for p in Path(path).as_posix().split('/'))

          collections=[]
          items=[]

          for folder,cid,title in defs:
              issues=[]
              for pdf in sorted((root/folder).glob('*.pdf'),key=lambda p:issue_of(p.name)):
                  issue=issue_of(pdf.name)
                  cover=pdf.with_name(pdf.stem+'-cover.webp')
                  doc=fitz.open(pdf)
                  try:
                      pages=doc.page_count
                      if not cover.exists() or cover.stat().st_mtime < pdf.stat().st_mtime:
                          page=doc.load_page(0)
                          pix=page.get_pixmap(matrix=fitz.Matrix(1.7,1.7),alpha=False)
                          image=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                          image.thumbnail((900,1400),Image.Resampling.LANCZOS)
                          image.save(cover,'WEBP',quality=84,method=6)
                  finally:
                      doc.close()

                  display=title if cid=='hulk-o-ultimo-tita' else f'{title} #{issue}'
                  entry={
                      'id':f'{cid}-{issue}',
                      'issue':issue,
                      'title':display,
                      'format':'pdf',
                      'file':raw+url_path(pdf),
                      'cover':raw+url_path(cover),
                      'size':pdf.stat().st_size,
                      'pageCount':pages
                  }
                  issues.append(entry)
                  items.append({**entry,'collectionId':cid,'collectionTitle':title})

              collections.append({'id':cid,'title':title,'issues':issues})

          catalog={
              'schemaVersion':1,
              'name':'Manga HQ Acervo Marvel',
              'publisher':'Marvel',
              'format':'pdf',
              'supportedFormats':['pdf'],
              'collections':collections,
              'items':items,
              'itemCount':len(items),
              'assetHost':'raw.githubusercontent.com',
              'assetBase':raw
          }
          Path('catalogo.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Marvel catalogado:',len(items),'HQs')
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          find . -name '*-cover.webp' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar catálogo e capas Marvel"
            git pull --rebase origin main
            git push
          fi
